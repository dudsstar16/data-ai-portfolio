name: Atualizar conteúdo profissional

on:
  workflow_dispatch:
  push:
    paths:
      - "curriculo/06-certificados/**/*.pdf"
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: write

concurrency:
  group: portfolio-content-sync
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Descobrir, decidir e sincronizar conteúdo
        run: npm run content:automate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar atualizações seguras
        shell: bash
        run: |
          if git diff --quiet -- data/projects.json data/certificates.json curriculo/04-revisao/painel-profissional.md curriculo/02-fonte/curriculo-analista-de-dados.md curriculo/03-layout/curriculo-analista-de-dados.html public/documents/curriculo-eduarda-reis.pdf; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/certificates.json curriculo/04-revisao/painel-profissional.md curriculo/02-fonte/curriculo-analista-de-dados.md curriculo/03-layout/curriculo-analista-de-dados.html public/documents/curriculo-eduarda-reis.pdf
          git commit -m "chore(content): automate portfolio updates"
          git push
