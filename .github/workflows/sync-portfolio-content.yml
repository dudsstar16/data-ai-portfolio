name: Sincronizar conteúdo do portfólio

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-content:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sincronizar catálogos
        run: npm run content:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detectar mudanças
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/projects.json data/certificates.json; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar branch e commit
        if: steps.changes.outputs.found == 'true'
        shell: bash
        run: |
          branch="automation/content-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/projects.json data/certificates.json
          git commit -m "chore(content): sync projects and certificates"
          git push origin "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Abrir Pull Request
        if: steps.changes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(content): revisar novos projetos e certificados" \
            --body "Sincronização automática. Revise os itens com status review e marque como published somente após validar o conteúdo."
